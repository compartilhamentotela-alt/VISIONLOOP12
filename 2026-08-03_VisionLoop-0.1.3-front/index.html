<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionLoop</title>
<link rel="icon" href="/VISIONLOOP12/2026-08-03_VisionLoop-0.1.3/assets/visionloop-icon.png" type="image/png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #d9f2fb 0%, #e6effb 45%, #ece3fb 75%, #e4d9fb 100%);
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh; overflow: hidden;
  }

  /* ---------- Launcher ---------- */
  #launcher {
    height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 48px; text-align: center; padding: 40px;
  }

  .logo-big { width: 180px; }
  .logo-fallback {
    font-size: 26px; font-weight: 700; letter-spacing: -0.5px; color: #fff;
  }
  .logo-fallback span { color: #6c63ff; }

  .subtitle { color: #666; font-size: 14px; margin-top: 8px; }

  .choice-row {
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
  }

  .choice-card {
    background: #1a1a1a; border: 2px solid rgba(255,255,255,0.08);
    border-radius: 18px; padding: 36px 44px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    cursor: pointer; width: 220px;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .choice-card:hover {
    border-color: #6c63ff; background: #202020; transform: translateY(-2px);
  }
  .choice-card:active { transform: scale(0.98); }

  .choice-icon {
    width: 64px; height: 64px; border-radius: 16px;
    background: rgba(108,99,255,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }

  .choice-title { font-size: 17px; font-weight: 700; }
  .choice-desc { font-size: 12px; color: #777; line-height: 1.5; }

  /* ---------- App view ---------- */
  #appView {
    display: none;
    height: 100vh; width: 100vw; position: relative;
  }
  #appView.show { display: block; }

  #appFrame {
    width: 100%; height: 100%; border: none; display: block; background: #000;
  }

  #backBtn {
    position: fixed; top: 14px; left: 14px; z-index: 99999;
    background: rgba(20,20,20,0.85); color: #ccc; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; backdrop-filter: blur(6px);
    display: flex; align-items: center; gap: 6px;
    opacity: 0.55; transition: opacity 0.15s;
  }
  #backBtn:hover { opacity: 1; }
</style>
</head>
<body>

<!-- TELA INICIAL: escolher para onde entrar -->
<div id="launcher">
  <div>
    <img class="logo-big" src="/assets/logo.png" alt="VisionLoop" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
    <div id="logoFallback" class="logo-fallback" style="display:none;">Vision<span>Loop</span></div>
    <div class="subtitle">Escolha como deseja entrar</div>
  </div>

  <div class="choice-row">
    <div class="choice-card" onclick="openApp('controller')">
      <div class="choice-icon">🎮</div>
      <div class="choice-title">Controlador</div>
      <div class="choice-desc">Gerenciar TVs, enviar videos e criar playlists</div>
    </div>

    <div class="choice-card" onclick="openApp('tv')">
      <div class="choice-icon">📺</div>
      <div class="choice-title">TV</div>
      <div class="choice-desc">Exibir conteudo recebido do controlador</div>
    </div>
  </div>
</div>

<!-- TELA DO APP ESCOLHIDO -->
<div id="appView">
  <button id="backBtn" onclick="closeApp()">&larr; Voltar</button>
  <!-- Apenas "allowfullscreen": usar os dois atributos juntos gera o aviso
       "Allow attribute will take precedence over 'allowfullscreen'" no console.
       O atributo legado funciona nos navegadores modernos e também nos
       navegadores antigos de Smart TV, que não entendem o atributo "allow". -->
  <iframe id="appFrame" allowfullscreen></iframe>
</div>

<script>
function openApp(key) {
  // Navega o iframe para o arquivo real no servidor (nao mais base64/srcdoc),
  // assim WebSocket e fetch() dentro do app resolvem para o host correto.
  document.getElementById('appFrame').src = key === 'tv' ? '/tv.html' : '/controller.html';
  document.getElementById('launcher').style.display = 'none';
  document.getElementById('appView').classList.add('show');
}

function closeApp() {
  document.getElementById('appView').classList.remove('show');
  document.getElementById('appFrame').src = 'about:blank';
  document.getElementById('launcher').style.display = 'flex';
}
</script>
</body>
</html>
